# base config for motion adapter training
seed: 1729
backbone: stabilityai/stable-diffusion-3-turbo
resolution: 512
num_frames: 48        # 4s * 12fps
fps: 12
motion:
  channels: 320
  heads: 8
  head_dim: 40
  temporal_layers: 4
  pos_embed_max_len: 64
train:
  batch_size: 2
  grad_accum: 4
  lr: 1.0e-4
  weight_decay: 1.0e-2
  warmup_steps: 500
  max_steps: 20000
  freeze_backbone: true
  mixed_precision: bf16
  clip_grad_norm: 1.0
  save_every: 1000
data:
  root: data/webvid_subset
  min_clip_seconds: 2.5
  max_clip_seconds: 6.0
inference:
  cfg_scale: 7.5
  motion_scale: 1.0
  num_inference_steps: 6   # sd3-turbo
logging:
  project: video-motion-adapter
  entity: null
