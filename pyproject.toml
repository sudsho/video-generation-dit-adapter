[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "video-generation-dit-adapter"
version = "0.1.0"
description = "Architectural sketch for an AnimateDiff-style temporal motion module intended to sit on top of a frozen image diffusion transformer."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Sudhanshu Srivastava" }]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
